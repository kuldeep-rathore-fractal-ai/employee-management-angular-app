<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      @let isLoading = isLoading$ | async;
      @if (isLoading) {
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-3 text-muted">Loading employee data...</p>
        </div>
      }

      @if (!isLoading) {
        @let employee = employee$ | async;
        @if (employee) {
          <h1 class="mb-4">Update Employee</h1>

          @let errorMessage = errorMessage$ | async;
          @if (errorMessage) {
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
              {{ errorMessage }}
              <button type="button" class="btn-close" (click)="clearError()"></button>
            </div>
          }

          <div class="card shadow-sm">
            <div class="card-body p-5">
              <form (ngSubmit)="onSubmit()">
                <div class="mb-3">
                  <label for="firstName" class="form-label">First Name *</label>
                  <input
                    type="text"
                    id="firstName"
                    [(ngModel)]="employee.firstName"
                    name="firstName"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="lastName" class="form-label">Last Name *</label>
                  <input
                    type="text"
                    id="lastName"
                    [(ngModel)]="employee.lastName"
                    name="lastName"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="position" class="form-label">Position *</label>
                  <input
                    type="text"
                    id="position"
                    [(ngModel)]="employee.position"
                    name="position"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="department" class="form-label">Department *</label>
                  <input
                    type="text"
                    id="department"
                    [(ngModel)]="employee.department"
                    name="department"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email *</label>
                  <input
                    type="email"
                    id="email"
                    [(ngModel)]="employee.email"
                    name="email"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="salary" class="form-label">Salary *</label>
                  <input
                    type="number"
                    id="salary"
                    [(ngModel)]="employee.salary"
                    name="salary"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label for="dateOfJoining" class="form-label">Date of Joining *</label>
                  <input
                    type="date"
                    id="dateOfJoining"
                    [(ngModel)]="employee.dateOfJoining"
                    name="dateOfJoining"
                    class="form-control"
                    required
                  />
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                  <button type="button" (click)="onCancel()" class="btn btn-secondary">
                    Cancel
                  </button>
                  <button type="submit" class="btn btn-primary" [disabled]="isLoading">
                    @if (isLoading) {
                      <span class="spinner-border spinner-border-sm me-2"></span>
                    }
                    {{ isLoading ? 'Updating...' : 'Update Employee' }}
                  </button>
                </div>
              </form>
            </div>
          </div>
        }
      }
    </div>
  </div>
</div>
